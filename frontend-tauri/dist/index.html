<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-tauri</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
      }
      p {
        margin: 0;
      }
      .subtitle {
        opacity: 0.85;
        margin-bottom: 1.5rem;
      }
      .card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      label {
        font-size: 0.9rem;
        opacity: 0.9;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #4b5563;
        background: #111827;
        color: #e5e7eb;
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
      }
      button {
        border: 1px solid #4b5563;
        background: #2563eb;
        color: white;
        border-radius: 0.5rem;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: #374151;
      }
      button:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .status {
        font-size: 0.92rem;
        margin-top: 0.75rem;
        min-height: 1.25rem;
      }
      .status.error {
        color: #fca5a5;
      }
      .status.ok {
        color: #86efac;
      }
      pre {
        white-space: pre-wrap;
        margin: 0;
        min-height: 7rem;
        border-radius: 0.5rem;
        background: #111827;
        border: 1px solid #374151;
        padding: 0.75rem;
        color: #d1d5db;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      .hint {
        min-height: 1.1rem;
        font-size: 0.85rem;
        opacity: 0.9;
      }
      .hint.ok {
        color: #86efac;
      }
      .hint.error {
        color: #fca5a5;
      }
      .hint.neutral {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>frontend-tauri</h1>
      <p class="subtitle">Minimal interactive shell wired to Tauri commands.</p>

      <section class="card">
        <div class="row">
          <div class="field">
            <label for="modelPath">Model path (.bin)</label>
            <input id="modelPath" placeholder="C:\\models\\ggml-base.en.bin" />
            <p id="modelHint" class="hint neutral">Model not validated yet.</p>
          </div>
          <div>
            <button id="pickModelBtn" class="secondary" type="button">Browse...</button>
            <button id="validateModelBtn" class="secondary" type="button">Validate model</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <div class="field">
            <label for="audioPath">Audio path (.wav, .mp3, .flac, .ogg, .m4a)</label>
            <input id="audioPath" placeholder="C:\\samples\\jfk.wav" />
            <p id="audioHint" class="hint neutral">Audio not validated yet.</p>
          </div>
          <div>
            <button id="pickAudioBtn" class="secondary" type="button">Browse...</button>
            <button id="validateAudioBtn" class="secondary" type="button">Validate audio</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <button id="healthBtn" class="secondary" type="button">Check health</button>
          <button id="runBtn" type="button">Run transcription</button>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section class="card">
        <label for="transcript">Transcript</label>
        <div class="actions">
          <button id="exportTxtBtn" class="secondary" type="button">Export TXT</button>
          <button id="exportSrtBtn" class="secondary" type="button">Export SRT</button>
          <button id="exportVttBtn" class="secondary" type="button">Export VTT</button>
          <button id="exportJsonBtn" class="secondary" type="button">Export JSON</button>
          <button id="openOutputFolderBtn" class="secondary" type="button" disabled>
            Open output folder
          </button>
        </div>
        <pre id="transcript">(no transcript yet)</pre>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const transcriptEl = document.getElementById("transcript");
      const modelPathEl = document.getElementById("modelPath");
      const audioPathEl = document.getElementById("audioPath");
      const modelHintEl = document.getElementById("modelHint");
      const audioHintEl = document.getElementById("audioHint");
      const runBtn = document.getElementById("runBtn");
      const openOutputFolderBtn = document.getElementById("openOutputFolderBtn");
      let latestTranscript = "";
      let latestExportPath = "";
      let runStartedAt = null;
      let isRunning = false;
      let modelValid = false;
      let audioValid = false;

      function setStatus(message, kind = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${kind}`.trim();
      }

      function showError(prefix, error) {
        const code = error?.code ? `[${error.code}] ` : "";
        const message = error?.message || String(error);
        setStatus(`${prefix}: ${code}${message}`, "error");
      }

      function setHint(element, message, kind) {
        element.textContent = message;
        element.className = `hint ${kind}`;
      }

      function updateRunAvailability() {
        runBtn.disabled = isRunning || !modelValid || !audioValid;
      }

      function resetModelValidationHint() {
        modelValid = false;
        setHint(modelHintEl, "Model not validated yet.", "neutral");
        updateRunAvailability();
      }

      function resetAudioValidationHint() {
        audioValid = false;
        setHint(audioHintEl, "Audio not validated yet.", "neutral");
        updateRunAvailability();
      }

      function requireTranscript() {
        const transcript = latestTranscript.trim();
        if (!transcript) {
          throw new Error("No transcript available to export");
        }
        return transcript;
      }

      async function exportTranscript(format) {
        try {
          const transcript = requireTranscript();
          setStatus(`Exporting ${format.toUpperCase()}...`);
          const savedPath = await invoke("export_transcript_command", {
            transcript,
            format,
          });
          latestExportPath = savedPath;
          openOutputFolderBtn.disabled = false;
          setStatus(`Exported ${format.toUpperCase()} to ${savedPath}`, "ok");
        } catch (error) {
          showError(`Export ${format.toUpperCase()} failed`, error);
        }
      }

      async function invoke(command, args = {}) {
        const tauriInvoke = window.__TAURI__?.core?.invoke;
        if (!tauriInvoke) {
          throw new Error("Tauri invoke API not available");
        }
        return tauriInvoke(command, args);
      }

      async function validateModelPath() {
        setStatus("Validating model path...");
        try {
          const response = await invoke("validate_model_path_command", {
            path: modelPathEl.value,
          });
          modelValid = true;
          setHint(modelHintEl, `Valid model: ${response.normalized_path}`, "ok");
          setStatus("Model validation succeeded.", "ok");
          updateRunAvailability();
          return true;
        } catch (error) {
          modelValid = false;
          const message = error?.message || "Model path is invalid.";
          setHint(modelHintEl, message, "error");
          showError("Model validation failed", error);
          updateRunAvailability();
          return false;
        }
      }

      async function validateAudioPath() {
        setStatus("Validating audio path...");
        try {
          const response = await invoke("validate_audio_path_command", {
            path: audioPathEl.value,
          });
          audioValid = true;
          setHint(audioHintEl, `Valid audio: ${response.normalized_path}`, "ok");
          setStatus("Audio validation succeeded.", "ok");
          updateRunAvailability();
          return true;
        } catch (error) {
          audioValid = false;
          const message = error?.message || "Audio path is invalid.";
          setHint(audioHintEl, message, "error");
          showError("Audio validation failed", error);
          updateRunAvailability();
          return false;
        }
      }

      document.getElementById("healthBtn").addEventListener("click", async () => {
        setStatus("Checking app health...");
        try {
          const response = await invoke("app_health_command");
          setStatus(`Health: ${response.status} (${response.version})`, "ok");
        } catch (error) {
          showError("Health check failed", error);
        }
      });

      document
        .getElementById("validateModelBtn")
        .addEventListener("click", validateModelPath);

      document
        .getElementById("validateAudioBtn")
        .addEventListener("click", validateAudioPath);

      modelPathEl.addEventListener("input", resetModelValidationHint);
      audioPathEl.addEventListener("input", resetAudioValidationHint);

      runBtn.addEventListener("click", async () => {
        const isModelOk = await validateModelPath();
        const isAudioOk = await validateAudioPath();
        if (!isModelOk || !isAudioOk) {
          setStatus("Fix validation errors before running transcription.", "error");
          return;
        }

        isRunning = true;
        updateRunAvailability();
        runStartedAt = Date.now();
        setStatus("Running transcription...", "");
        transcriptEl.textContent = "(running)";

        try {
          const response = await invoke("run_transcription_command", {
            modelPath: modelPathEl.value,
            audioPath: audioPathEl.value,
          });
          latestTranscript = (response.transcript || "").trim();
          transcriptEl.textContent = latestTranscript || "(empty transcript)";
          const elapsedMs = Date.now() - runStartedAt;
          setStatus(`Transcription completed in ${(elapsedMs / 1000).toFixed(2)}s`, "ok");
        } catch (error) {
          latestTranscript = "";
          transcriptEl.textContent = "(failed)";
          const elapsedMs = runStartedAt ? Date.now() - runStartedAt : 0;
          if (elapsedMs > 0) {
            setStatus(`Failed after ${(elapsedMs / 1000).toFixed(2)}s`, "error");
          }
          showError("Transcription failed", error);
        } finally {
          runStartedAt = null;
          isRunning = false;
          updateRunAvailability();
        }
      });

      document.getElementById("pickModelBtn").addEventListener("click", async () => {
        setStatus("Selecting model file...");
        try {
          const selectedPath = await invoke("pick_model_path_command");
          modelPathEl.value = selectedPath;
          setStatus("Model file selected", "ok");
          await validateModelPath();
        } catch (error) {
          showError("Model selection failed", error);
        }
      });

      document.getElementById("pickAudioBtn").addEventListener("click", async () => {
        setStatus("Selecting audio file...");
        try {
          const selectedPath = await invoke("pick_audio_path_command");
          audioPathEl.value = selectedPath;
          setStatus("Audio file selected", "ok");
          await validateAudioPath();
        } catch (error) {
          showError("Audio selection failed", error);
        }
      });

      document.getElementById("exportTxtBtn").addEventListener("click", () => exportTranscript("txt"));
      document.getElementById("exportSrtBtn").addEventListener("click", () => exportTranscript("srt"));
      document.getElementById("exportVttBtn").addEventListener("click", () => exportTranscript("vtt"));
      document.getElementById("exportJsonBtn").addEventListener("click", () => exportTranscript("json"));

      openOutputFolderBtn.addEventListener("click", async () => {
        if (!latestExportPath) {
          setStatus("No exported file yet.", "error");
          return;
        }

        try {
          await invoke("open_output_folder_command", {
            filePath: latestExportPath,
          });
          setStatus("Opened output folder.", "ok");
        } catch (error) {
          showError("Open output folder failed", error);
        }
      });

      updateRunAvailability();
    </script>
  </body>
</html>
