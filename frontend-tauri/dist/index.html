<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-tauri</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
      }
      p {
        margin: 0;
      }
      .subtitle {
        opacity: 0.85;
        margin-bottom: 1.5rem;
      }
      .card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      label {
        font-size: 0.9rem;
        opacity: 0.9;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #4b5563;
        background: #111827;
        color: #e5e7eb;
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
      }
      button {
        border: 1px solid #4b5563;
        background: #2563eb;
        color: white;
        border-radius: 0.5rem;
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: #374151;
      }
      button:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .status {
        font-size: 0.92rem;
        margin-top: 0.75rem;
        min-height: 1.25rem;
      }
      .status.error {
        color: #fca5a5;
      }
      .status.ok {
        color: #86efac;
      }
      pre {
        white-space: pre-wrap;
        margin: 0;
        min-height: 7rem;
        border-radius: 0.5rem;
        background: #111827;
        border: 1px solid #374151;
        padding: 0.75rem;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>frontend-tauri</h1>
      <p class="subtitle">Minimal interactive shell wired to Tauri commands.</p>

      <section class="card">
        <div class="row">
          <div class="field">
            <label for="modelPath">Model path (.bin)</label>
            <input id="modelPath" placeholder="C:\\models\\ggml-base.en.bin" />
          </div>
          <div>
            <button id="pickModelBtn" class="secondary" type="button">Browse...</button>
            <button id="validateModelBtn" class="secondary" type="button">Validate model</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <div class="field">
            <label for="audioPath">Audio path (.wav, .mp3, .flac, .ogg, .m4a)</label>
            <input id="audioPath" placeholder="C:\\samples\\jfk.wav" />
          </div>
          <div>
            <button id="pickAudioBtn" class="secondary" type="button">Browse...</button>
            <button id="validateAudioBtn" class="secondary" type="button">Validate audio</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <button id="healthBtn" class="secondary" type="button">Check health</button>
          <button id="runBtn" type="button">Run transcription</button>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section class="card">
        <label for="transcript">Transcript</label>
        <pre id="transcript">(no transcript yet)</pre>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const transcriptEl = document.getElementById("transcript");
      const modelPathEl = document.getElementById("modelPath");
      const audioPathEl = document.getElementById("audioPath");
      const runBtn = document.getElementById("runBtn");

      function setStatus(message, kind = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${kind}`.trim();
      }

      function showError(prefix, error) {
        const code = error?.code ? `[${error.code}] ` : "";
        const message = error?.message || String(error);
        setStatus(`${prefix}: ${code}${message}`, "error");
      }

      async function invoke(command, args = {}) {
        const tauriInvoke = window.__TAURI__?.core?.invoke;
        if (!tauriInvoke) {
          throw new Error("Tauri invoke API not available");
        }
        return tauriInvoke(command, args);
      }

      document.getElementById("healthBtn").addEventListener("click", async () => {
        setStatus("Checking app health...");
        try {
          const response = await invoke("app_health_command");
          setStatus(`Health: ${response.status} (${response.version})`, "ok");
        } catch (error) {
          showError("Health check failed", error);
        }
      });

      document
        .getElementById("validateModelBtn")
        .addEventListener("click", async () => {
          setStatus("Validating model path...");
          try {
            const response = await invoke("validate_model_path_command", {
              path: modelPathEl.value,
            });
            setStatus(`Model valid: ${response.normalized_path}`, "ok");
          } catch (error) {
            showError("Model validation failed", error);
          }
        });

      document
        .getElementById("validateAudioBtn")
        .addEventListener("click", async () => {
          setStatus("Validating audio path...");
          try {
            const response = await invoke("validate_audio_path_command", {
              path: audioPathEl.value,
            });
            setStatus(`Audio valid: ${response.normalized_path}`, "ok");
          } catch (error) {
            showError("Audio validation failed", error);
          }
        });

      runBtn.addEventListener("click", async () => {
        runBtn.disabled = true;
        setStatus("Running transcription...");
        transcriptEl.textContent = "(running)";

        try {
          const response = await invoke("run_transcription_command", {
            modelPath: modelPathEl.value,
            audioPath: audioPathEl.value,
          });
          transcriptEl.textContent = response.transcript || "(empty transcript)";
          setStatus("Transcription completed", "ok");
        } catch (error) {
          transcriptEl.textContent = "(failed)";
          showError("Transcription failed", error);
        } finally {
          runBtn.disabled = false;
        }
      });

      document.getElementById("pickModelBtn").addEventListener("click", async () => {
        setStatus("Selecting model file...");
        try {
          const selectedPath = await invoke("pick_model_path_command");
          modelPathEl.value = selectedPath;
          setStatus("Model file selected", "ok");
        } catch (error) {
          showError("Model selection failed", error);
        }
      });

      document.getElementById("pickAudioBtn").addEventListener("click", async () => {
        setStatus("Selecting audio file...");
        try {
          const selectedPath = await invoke("pick_audio_path_command");
          audioPathEl.value = selectedPath;
          setStatus("Audio file selected", "ok");
        } catch (error) {
          showError("Audio selection failed", error);
        }
      });
    </script>
  </body>
</html>
